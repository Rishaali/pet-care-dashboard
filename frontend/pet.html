<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petzi – Pet Care &amp; Log Dashboard</title>
    <meta name="description" content="View comprehensive health records, individual feeding, walking, and medication logs for your pet.">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Shared Styles -->
    <link rel="stylesheet" href="petzi.css">
    <link rel="stylesheet" href="notifications.css">

    <style>
        /* Pet Switcher Bar */
        .pet-switcher-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow-x: auto;
            padding: 8px 0 16px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .pet-switcher-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pet-switch-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 100px;
            background: #FFFFFF;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.88rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition-fast);
            white-space: nowrap;
        }

        .pet-switch-pill:hover {
            border-color: var(--brand-primary);
            color: var(--brand-primary);
        }

        .pet-switch-pill.active {
            background: var(--brand-primary-light);
            border-color: var(--brand-primary);
            color: var(--brand-primary);
            font-weight: 700;
        }

        /* Profile Hero (Crisp White Card with subtle cream backdrop) */
        .profile-hero {
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
        }

        .profile-hero-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .profile-hero-name {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.6rem, 3.5vw, 2.2rem);
            font-weight: 800;
            color: var(--text-primary);
        }

        .profile-hero-sub {
            color: var(--text-secondary);
            font-size: 0.92rem;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .profile-hero-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Summary Stats Cards Grid */
        .summary-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition-fast);
        }

        .stat-card:hover {
            border-color: #D6CCC0;
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .stat-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-card-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .stat-card-icon {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .stat-card-icon.feeding { background: #FEF3C7; color: #D97706; }
        .stat-card-icon.walking { background: #DCFCE7; color: #16A34A; }
        .stat-card-icon.medication { background: #E0F2FE; color: #0284C7; }
        .stat-card-icon.info { background: var(--bg-card-alt); color: var(--text-secondary); }

        .stat-card-val {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.1;
        }

        .stat-card-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.3;
        }

        /* Two Column Main Content */
        .pet-content-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
        }

        @media (max-width: 960px) {
            .pet-content-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Log Section & Tabs */
        .logs-container-card {
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: var(--shadow-sm);
        }

        .logs-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 14px;
        }

        .logs-title-group h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logs-title-group p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .log-action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-log-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 13px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid transparent;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .btn-log-feed {
            background: #FEF3C7;
            border-color: #FDE68A;
            color: #92400E;
        }
        .btn-log-feed:hover { background: #FDE68A; }

        .btn-log-walk {
            background: #DCFCE7;
            border-color: #BBF7D0;
            color: #14532D;
        }
        .btn-log-walk:hover { background: #BBF7D0; }

        .btn-log-med {
            background: #E0F2FE;
            border-color: #BAE6FD;
            color: #0369A1;
        }
        .btn-log-med:hover { background: #BAE6FD; }

        /* Log Filter Tabs */
        .log-tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-card-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 3px;
            overflow-x: auto;
        }

        .log-tab {
            padding: 6px 14px;
            border-radius: calc(var(--radius-sm) - 2px);
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .log-tab:hover {
            color: var(--brand-primary);
            background: rgba(0, 0, 0, 0.03);
        }

        .log-tab.active {
            background: #FFFFFF;
            color: var(--brand-primary);
            box-shadow: var(--shadow-sm);
        }

        /* Log Entries List */
        .logs-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .log-entry-card {
            background: var(--bg-card-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            transition: var(--transition-fast);
        }

        .log-entry-card:hover {
            background: #FFFFFF;
            border-color: #D6CCC0;
            box-shadow: var(--shadow-sm);
        }

        .log-entry-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .log-entry-icon {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .log-entry-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .log-entry-notes {
            font-size: 0.83rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .log-entry-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 3px;
            flex-shrink: 0;
        }

        .log-entry-time {
            font-size: 0.83rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .log-entry-rel {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .btn-delete-log {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            opacity: 0.6;
            transition: var(--transition-fast);
            padding: 4px;
        }

        .btn-delete-log:hover {
            color: #DC2626;
            opacity: 1;
        }

        /* Empty State */
        .log-empty-state {
            text-align: center;
            padding: 36px 20px;
            color: var(--text-muted);
        }

        .log-empty-state .empty-icon {
            font-size: 2.8rem;
            margin-bottom: 8px;
            color: #CBD5E1;
        }

        .log-empty-state h4 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .log-empty-state p {
            font-size: 0.88rem;
            margin-bottom: 14px;
        }

        /* Modals */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 580px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
            transform: translateY(16px) scale(0.98);
            transition: transform 0.2s ease;
            overflow: hidden;
        }

        .modal-backdrop.open .modal-content {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card-alt);
        }

        .modal-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .btn-modal-close:hover {
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-primary);
        }

        .modal-body {
            padding: 22px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-footer {
            padding: 16px 22px;
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            background: var(--bg-card-alt);
        }

        .btn-danger {
            background: #FEE2E2;
            border: 1px solid #FECACA;
            color: #B91C1C;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition-fast);
        }

        .btn-danger:hover {
            background: #FECACA;
        }
    </style>
</head>

<script>
    // ----------------------------------------------------
    // Authentication & State Setup
    // ----------------------------------------------------
    const currentUser = JSON.parse(localStorage.getItem('petziUser') || 'null');
    const authToken = localStorage.getItem('petziToken');
    if (!currentUser || !currentUser.id || !authToken) {
        window.location.replace('auth.html?mode=login');
        throw new Error('Authentication required');
    }

    function authHeaders(extraHeaders = {}) {
        return { ...extraHeaders, Authorization: `Bearer ${authToken}` };
    }

    async function authFetch(url, options = {}) {
        const response = await fetch(url, {
            ...options,
            headers: authHeaders(options.headers || {})
        });
        if (response.status === 401 || response.status === 403) {
            localStorage.removeItem('petziUser');
            localStorage.removeItem('petziToken');
            window.location.replace('auth.html?mode=login');
        }
        return response;
    }

    document.getElementById('nav-username').textContent = currentUser.name.split(' ')[0];
    document.getElementById('btn-logout').addEventListener('click', () => {
        localStorage.removeItem('petziUser');
        localStorage.removeItem('petziToken');
        window.location.replace('home.html');
    });

        'fish': '🐠', 'hamster': '🐹', 'other': '🐾'
    };

    function getSpeciesEmoji(species) {
        if (!species) return '🐾';
        return speciesEmojiMap[species.toLowerCase().trim()] || '🐾';
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function formatTime(isoString) {
        if (!isoString) return '';
        const d = new Date(isoString);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function formatNiceDate(isoString) {
        if (!isoString) return '';
        const d = new Date(isoString);
        const today = new Date();
        const yesterday = new Date();
        yesterday.setDate(today.getDate() - 1);

        if (d.toDateString() === today.toDateString()) return 'Today';
        if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
        return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
    }

    function formatRelativeTime(isoString) {
        if (!isoString) return 'Never';
        const d = new Date(isoString);
        const now = new Date();
        const diffMs = now - d;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);

        if (diffMins < 1) return 'Just now';
        if (diffMins < 60) return `${diffMins}m ago`;
        if (diffHours < 24) return `${diffHours}h ago`;
        return formatNiceDate(isoString);
    }

    // Load All Pets for Switcher Bar
    // ----------------------------------------------------
    async function loadUserPetsSwitcher() {
        try {
            const res = await authFetch('/api/pets');
            if (!res.ok) return;
            userPets = await res.json();

            const pillsContainer = document.getElementById('pet-switcher-pills');
            pillsContainer.innerHTML = '';

            if (userPets.length === 0) {
                pillsContainer.innerHTML = '<span style="color:var(--text-muted);font-size:0.85rem;">No pets yet</span>';
                return;
            }

            // If no petId in URL or invalid, select first pet
            if (!currentPetId || !userPets.some(p => p.id == currentPetId)) {
                currentPetId = userPets[0].id;
                const newUrl = new URL(window.location);
                newUrl.searchParams.set('id', currentPetId);
                window.history.replaceState({}, '', newUrl);
            }

            userPets.forEach(pet => {
                const isActive = pet.id == currentPetId;
                const pill = document.createElement('button');
                pill.className = `pet-switch-pill ${isActive ? 'active' : ''}`;
                pill.innerHTML = `<span>${getSpeciesEmoji(pet.species)}</span> <span>${escapeHtml(pet.name)}</span>`;
                pill.onclick = () => switchPet(pet.id);
                pillsContainer.appendChild(pill);
            });

        } catch (err) {
            console.error('Error loading pets for switcher:', err);
        }
    }

    function switchPet(newPetId) {
        currentPetId = newPetId;
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('id', newPetId);
        window.history.pushState({}, '', newUrl);

        // Update active class on pills
        document.querySelectorAll('.pet-switch-pill').forEach(pill => {
            pill.classList.remove('active');
        });
        loadUserPetsSwitcher();
        loadPetDashboard();
    }

    function setLogTab(tab) {

        renderCurrentPetLogs();
    }

    function renderCurrentPetLogs() {
        const listContainer = document.getElementById('pet-logs-list');
        if (!listContainer) return;

        let filtered = currentPetLogs;
        if (currentActiveTab !== 'all') {
            filtered = currentPetLogs.filter(l => l.activity_type.toLowerCase() === currentActiveTab.toLowerCase());
        }

        if (filtered.length === 0) {
            const petName = currentPet ? currentPet.name : 'your pet';
            let emptyIcon = 'history';
            let emptyTitle = `No care records yet`;
            let emptyMsg = `Start logging daily activities for ${escapeHtml(petName)}.`;

            if (currentActiveTab === 'feeding') {
                emptyIcon = 'restaurant';
                emptyTitle = `No feeding records yet`;
                emptyMsg = `Start tracking ${escapeHtml(petName)}'s feeding routine.`;
            } else if (currentActiveTab === 'walking') {
                emptyIcon = 'directions_walk';
                emptyTitle = `No walking records yet`;
                emptyMsg = `Start tracking ${escapeHtml(petName)}'s daily walks and exercise.`;
            } else if (currentActiveTab === 'medication') {
                emptyIcon = 'medication';
                emptyTitle = `No medication records yet`;
                emptyMsg = `Keep track of ${escapeHtml(petName)}'s prescriptions and doses.`;
            }

            listContainer.innerHTML = `
                <div class="log-empty-state">
                    <div class="empty-icon"><span class="material-icons" style="font-size:3rem;">${emptyIcon}</span></div>
                    <h4>${emptyTitle}</h4>
                    <p>${emptyMsg}</p>
                    <button class="btn-secondary btn-sm" onclick="openLogModal('${currentActiveTab === 'all' ? 'Feeding' : capitalize(currentActiveTab)}')">
                        <span class="material-icons" style="font-size:0.9rem;">add</span> Add Record
                    </button>
                </div>
            `;
            return;
        }

        let html = '';
        filtered.forEach(log => {
            let icon = 'restaurant';
            let iconClass = 'feeding';
            if (log.activity_type.toLowerCase() === 'walking') {
                icon = 'directions_walk';
                iconClass = 'walking';
            } else if (log.activity_type.toLowerCase() === 'medication') {
                icon = 'medication';
                iconClass = 'medication';
            }

            const dayLabel = formatNiceDate(log.timestamp);
            const timeLabel = formatTime(log.timestamp);
            const relLabel = formatRelativeTime(log.timestamp);

            html += `
                <div class="log-entry-card">
                    <div class="log-entry-left">
                        <div class="stat-card-icon ${iconClass} log-entry-icon">
                            <span class="material-icons">${icon}</span>
                        </div>
                        <div>
                            <div class="log-entry-title">${escapeHtml(log.activity_type)}</div>
                            <div class="log-entry-notes">${escapeHtml(log.notes || 'Logged successfully')}</div>
                        </div>
                    </div>
                    <div class="log-entry-right">
                        <div class="log-entry-time">${dayLabel}, ${timeLabel}</div>
                        <div class="log-entry-rel">${relLabel}</div>
                        <button class="btn-delete-log" title="Delete log" onclick="deleteLogEntry(${log.id})">
                            <span class="material-icons" style="font-size:1.1rem;">delete_outline</span>
                        </button>
                    </div>
                </div>
            `;
        });

        listContainer.innerHTML = html;
    }

    function capitalize(s) {
        if (!s) return '';
        return s.charAt(0).toUpperCase() + s.slice(1);
    }

    // Submit Log Form
    document.getElementById('log-activity-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('log-modal-alert');
        alertBox.className = 'form-alert';
        alertBox.textContent = '';

        const type = document.getElementById('log-activity-type').value;
        const timeVal = document.getElementById('log-time').value;
        const extraNotes = document.getElementById('log-notes').value.trim();

        let details = [];

        if (type === 'Feeding') {
            const food = document.getElementById('feed-food') ? document.getElementById('feed-food').value.trim() : '';
            const qty = document.getElementById('feed-qty') ? document.getElementById('feed-qty').value.trim() : '';
            if (food) details.push(food);
            if (qty) details.push(qty);
        } else if (type === 'Walking') {
            const dur = document.getElementById('walk-duration') ? document.getElementById('walk-duration').value.trim() : '';
            const route = document.getElementById('walk-route') ? document.getElementById('walk-route').value.trim() : '';
            if (dur) details.push(dur);
            if (route) details.push(`at ${route}`);
        } else if (type === 'Medication') {
            const medName = document.getElementById('med-name') ? document.getElementById('med-name').value.trim() : '';
            const medDose = document.getElementById('med-dose') ? document.getElementById('med-dose').value.trim() : '';
            if (!medName) {
                alertBox.className = 'form-alert show error';
                alertBox.innerHTML = '<span class="material-icons">error_outline</span> Medication name is required.';
                return;
            }
            details.push(medName);
            if (medDose) details.push(`(${medDose})`);
        }

        if (extraNotes) details.push(`- ${extraNotes}`);
        const finalNotes = details.join(' • ') || `${type} recorded.`;

        const btn = document.getElementById('btn-submit-log');
        btn.disabled = true;
        btn.innerHTML = `<div class="spinner" style="width:16px;height:16px;border-width:2px;"></div> Saving...`;

        try {
            const res = await authFetch('/api/activities', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    pet_id: currentPetId,
                    activity_type: type,
                    notes: finalNotes,
                    timestamp: timeVal ? new Date(timeVal).toISOString() : new Date().toISOString()
                })
            });

            if (!res.ok) throw new Error('Failed to log activity');

            closeLogModal();
            showToast(`${type} logged for ${currentPet.name}! 🐾`);
            
            // Dynamic refresh without reloading the page
            await loadPetDashboard();

        } catch (err) {
            console.error(err);
            alertBox.className = 'form-alert show error';
            alertBox.innerHTML = '<span class="material-icons">error_outline</span> Failed to save record.';
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<span class="material-icons" style="font-size:1rem;">check_circle</span> Save Record`;
        }
    });

            showToast('Care record deleted.');

            alert('Failed to delete log entry.');
        }
    }

        document.getElementById('edit-pet-color').value = currentPet.color || '';
        document.getElementById('edit-pet-vac-status').value = currentPet.vaccination_status || 'Vaccinated';
        document.getElementById('edit-pet-last-vac').value = currentPet.last_vaccination_date || '';
        document.getElementById('edit-pet-next-vac').value = currentPet.next_vaccination_date || '';
        document.getElementById('edit-pet-health').value = currentPet.health_condition || '';
        document.getElementById('edit-pet-allergies').value = currentPet.allergies || '';
        document.getElementById('edit-pet-diet').value = currentPet.diet || '';

        editModal.classList.add('open');
        editModal.setAttribute('aria-hidden', 'false');
    }

    function closeEditModal() {
        editModal.classList.remove('open');
        editModal.setAttribute('aria-hidden', 'true');
    }

    editModal.addEventListener('click', (e) => {
        if (e.target === editModal) closeEditModal();
    });

    document.getElementById('edit-pet-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('edit-modal-alert');
        alertBox.className = 'form-alert';

        const name = document.getElementById('edit-pet-name').value.trim();
        if (!name) {
            alertBox.className = 'form-alert show error';
            alertBox.innerHTML = '<span class="material-icons">error_outline</span> Pet name is required.';
            return;
        }

        const payload = {
            ...currentPet,
            name: name,
            species: document.getElementById('edit-pet-species').value,
            breed: document.getElementById('edit-pet-breed').value.trim(),
            age: document.getElementById('edit-pet-age').value.trim(),
            gender: document.getElementById('edit-pet-gender').value,
            weight: document.getElementById('edit-pet-weight').value.trim(),
            color: document.getElementById('edit-pet-color').value.trim(),
            vaccination_status: document.getElementById('edit-pet-vac-status').value,
            last_vaccination_date: document.getElementById('edit-pet-last-vac').value || null,
            next_vaccination_date: document.getElementById('edit-pet-next-vac').value || null,
            health_condition: document.getElementById('edit-pet-health').value.trim(),
            allergies: document.getElementById('edit-pet-allergies').value.trim(),
            diet: document.getElementById('edit-pet-diet').value.trim()
        };

        try {
            const res = await authFetch(`/api/pets/${currentPetId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error('Failed to update');

            closeEditModal();
            showToast('Pet profile updated! 🐾');
            loadUserPetsSwitcher();
            loadPetDashboard();
        } catch (err) {
            alertBox.className = 'form-alert show error';
            alertBox.innerHTML = '<span class="material-icons">error_outline</span> Failed to update profile.';
        }
    });

    async function deletePet(id) {
        if (!confirm('Are you sure you want to delete this pet and its log history? This action cannot be undone.')) {
            return;
        }

        try {
            const res = await authFetch(`/api/pets/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('Failed to delete');
            showToast('Pet profile deleted.');
            setTimeout(() => {
                window.location.replace('pets.html');
            }, 600);
        } catch (err) {
            alert('Failed to delete pet.');
        }
    }

    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `petzi-toast ${type}`;
        toast.innerHTML = `<span class="material-icons" style="font-size:1.1rem;">${type === 'success' ? 'check_circle' : 'error'}</span> ${message}`;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.3s';
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    }

    // ----------------------------------------------------
    // Initialization
    // ----------------------------------------------------
    (async function init() {
        await loadUserPetsSwitcher();
        await loadPetDashboard();
    })();
</script>

<script src="notifications.js"></script></body>
</html>
